<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Vệ Tinh · Toán 10 — Đường tròn &amp; Elip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0f1330;
            --bg2: #171c44;
            --panel: #ffffff;
            --ink: #1c2340;
            --muted: #6b7394;
            --line: #e6e8f2;
            --indigo: #4f46e5;
            --indigo-soft: #eef0ff;
            --tangerine: #f59e0b;
            --emerald: #22c55e;
            --sky: #38bdf8;
            --violet: #7c3aed;
            --paper: #f4f5fb;
            --c1: #4f46e5;
            --c2: #0ea5e9;
            --c3: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 80% -10%, #e9ecff 0, transparent 60%),
                radial-gradient(900px 500px at -10% 110%, #fdeede 0, transparent 55%),
                var(--paper);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 14px 16px 90px;
        }

        .sct-ribbon {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .sct-back {
            text-decoration: none;
            color: var(--indigo);
            font-weight: 700;
            font-size: 13.5px;
            background: #fff;
            border: 1px solid var(--line);
            padding: 8px 14px;
            border-radius: 999px;
            box-shadow: 0 2px 8px -4px rgba(0, 0, 0, .15);
        }

        .sct-tag {
            font-weight: 800;
            font-size: 11px;
            letter-spacing: .6px;
            color: #fff;
            background: linear-gradient(120deg, #4f46e5, #7c3aed);
            padding: 7px 14px;
            border-radius: 999px;
        }

        /* ===== HEADER ===== */
        .g-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 12px 16px;
            box-shadow: 0 10px 30px -18px rgba(31, 41, 110, .4);
        }

        .g-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .g-logo {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .7);
        }

        .g-brand h1 {
            margin: 0;
            font-family: 'Baloo 2';
            font-size: 24px;
            color: var(--indigo);
            line-height: 1;
        }

        .g-brand .sub {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .g-hud {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .hud-pill {
            background: var(--indigo-soft);
            color: var(--indigo);
            border-radius: 999px;
            padding: 7px 13px;
            font-weight: 800;
            font-size: 13px;
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .hud-pill.best {
            background: #fff5e0;
            color: #b45309;
        }

        .hud-pill.star {
            background: #fef2f8;
            color: #db2777;
        }

        .g-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .g-qr .qb {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 3px;
            line-height: 0;
        }

        .g-qr .qb svg {
            width: 46px;
            height: 46px;
            display: block;
        }

        .g-qr small {
            font: 800 8px 'Baloo 2';
            color: var(--indigo);
        }

        /* ===== LEVEL BAR ===== */
        .g-levelbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 14px 0 10px;
        }

        .lv-node {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 2px solid var(--line);
            background: #fff;
            color: var(--muted);
            font: 800 15px 'Baloo 2';
            cursor: pointer;
            transition: .15s;
            position: relative;
        }

        .lv-node:hover {
            transform: translateY(-2px);
            border-color: var(--indigo);
        }

        .lv-node.cur {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 14px -6px rgba(79, 70, 229, .8);
        }

        .lv-node.done {
            color: var(--tangerine);
            border-color: #fcd9a3;
        }

        .lv-node.cur.done {
            color: #fff;
        }

        .lv-node.phieu {
            border-color: #fbbf24;
            background: #fffaf0;
            font-size: 18px;
        }

        .lv-node.phieu.done {
            background: #ecfdf5;
            border-color: #6ee7b7;
        }

        /* ===== MISSION ===== */
        .g-mission {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(120deg, #eef0ff, #f3ecff);
            border: 1px solid #dfe1ff;
            border-radius: 14px;
            padding: 11px 16px;
            font-size: 14.5px;
        }

        .g-mission .mi {
            font-size: 20px;
        }

        .g-mission .mtxt {
            flex: 1;
            line-height: 1.5;
        }

        .g-mission .mno {
            background: #1c2340;
            color: #fff;
            font: 800 12px 'Baloo 2';
            padding: 6px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* ===== ACHIEVEMENTS ===== */
        .g-achv {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0 4px;
        }

        .achv-chip {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 5px 11px;
            opacity: .7;
        }

        .achv-chip.on {
            color: #92400e;
            background: #fff7e6;
            border-color: #fcd9a3;
            opacity: 1;
        }

        .achv-chip.big.on {
            color: #fff;
            background: linear-gradient(120deg, #f59e0b, #ef4444);
            border: none;
        }

        /* ===== MAIN GRID ===== */
        .g-main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            margin-top: 12px;
            align-items: start;
        }

        .stage {
            position: relative;
            background: #0f1330;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 46px -22px rgba(15, 19, 48, .85);
            border: 1px solid #232a5a;
        }

        #cv {
            display: block;
            width: 100%;
        }

        .stage-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            background: rgba(17, 24, 56, .6);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            padding: 5px 15px 5px 6px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 4;
        }

        .stage-badge .sb-ico {
            font-size: 21px;
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle, var(--sbc, #4f7ce8) 0%, transparent 72%);
            animation: sbFloat 2.6s ease-in-out infinite;
        }

        .stage-badge .sb-name {
            color: #fff;
            font: 700 13px 'Baloo 2';
            letter-spacing: .2px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, .55);
        }

        @keyframes sbFloat {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-4px)
            }
        }

        .stage-badge::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 5px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            box-shadow: 0 0 0 0 var(--sbc, #4f7ce8);
            animation: sbPulse 2.2s ease-out infinite;
        }

        @keyframes sbPulse {
            0% {
                box-shadow: 0 0 0 0 var(--sbc, #4f7ce8);
                opacity: .55
            }

            100% {
                box-shadow: 0 0 0 15px transparent;
                opacity: 0
            }
        }

        #fxLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            top: -12px;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            animation: fall 1.6s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(115%) rotate(540deg);
                opacity: 0;
            }
        }

        .g-toast {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%) translateY(16px);
            background: rgba(17, 24, 56, .95);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            max-width: 92%;
            text-align: center;
            opacity: 0;
            transition: .25s;
            pointer-events: none;
        }

        .g-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* overlay cards (quiz / win) */
        .g-ovl {
            position: absolute;
            inset: 0;
            background: rgba(12, 16, 40, .72);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .g-ovl.show {
            display: flex;
        }

        .ovl-card {
            background: #fff;
            border-radius: 20px;
            padding: 22px 22px 18px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5);
            animation: pop .2s ease;
        }

        @keyframes pop {
            from {
                transform: scale(.94);
                opacity: .5;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        .quiz-ico {
            font-size: 34px;
        }

        /* ==== 🎁 Quà bất ngờ — thiết kế như ảnh tham chiếu ==== */
        #winCard .ovl-card {
            position: relative;
            max-width: 460px;
            width: 92%;
            background: #fff;
            border-radius: 22px;
            padding: 20px 22px 22px;
            box-shadow: 0 30px 70px -20px rgba(28, 36, 72, .55);
            text-align: left;
        }

        body.dark #winCard .ovl-card {
            background: #171b3a;
        }

        .gift-x {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #eef1fb;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .gift-x:hover {
            background: #e2e6f5;
        }

        .gift-hd {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-right: 34px;
            margin-bottom: 6px;
        }

        .gift-badge {
            flex: none;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border-radius: 11px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 6px 14px -4px rgba(79, 70, 229, .6);
        }

        .gift-hd-t {
            font: 800 18px 'Baloo 2', 'Be Vietnam Pro', sans-serif;
            color: #4f46e5;
        }

        .gift-hd-s {
            font-size: 12.5px;
            color: #64748b;
            margin-top: 1px;
            line-height: 1.35;
        }

        .gift-pre {
            text-align: center;
            padding: 14px 6px 6px;
        }

        .gift-cong {
            font: 800 17px 'Baloo 2', sans-serif;
            color: #4f46e5;
        }

        .gift-subhint {
            font-size: 13px;
            color: #64748b;
            margin: 6px 0 4px;
        }

        .gift-box3d {
            position: relative;
            display: inline-block;
            font-size: 84px;
            cursor: pointer;
            user-select: none;
            margin: 8px 0 4px;
            animation: giftShake 1.15s ease-in-out infinite;
        }

        .gift-box3d .gbx {
            display: inline-block;
            filter: drop-shadow(0 10px 16px rgba(124, 58, 237, .35));
        }

        .gift-box3d .spk {
            position: absolute;
            font-size: 24px;
            animation: spkTw 1.6s ease-in-out infinite;
        }

        .gift-box3d .spk1 {
            top: -2px;
            left: -14px;
        }

        .gift-box3d .spk2 {
            top: 8px;
            right: -16px;
            animation-delay: .5s;
        }

        .gift-box3d .spk3 {
            bottom: 2px;
            left: 6px;
            font-size: 18px;
            animation-delay: .9s;
        }

        @keyframes spkTw {

            0%,
            100% {
                opacity: .3;
                transform: scale(.8)
            }

            50% {
                opacity: 1;
                transform: scale(1.15)
            }
        }

        @keyframes giftShake {

            0%,
            100% {
                transform: rotate(-6deg) scale(1)
            }

            25% {
                transform: rotate(6deg) scale(1.05)
            }

            50% {
                transform: rotate(-3deg) scale(1)
            }

            75% {
                transform: rotate(3deg) scale(1.03)
            }
        }

        .gift-open {
            padding-top: 6px;
        }

        .gift-tip {
            border: 2px solid #c7d2fe;
            background: linear-gradient(180deg, #f5f7ff, #eef2ff);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin: 6px 0 14px;
        }

        .gift-tip-ico {
            font-size: 40px;
            line-height: 1;
            animation: spkTw 2s ease-in-out infinite;
        }

        .gift-tip-t {
            font: 800 16px 'Baloo 2', sans-serif;
            color: #4f46e5;
            margin: 4px 0 6px;
        }

        .gift-tip-d {
            font-size: 14px;
            color: #1c2438;
            line-height: 1.5;
        }

        .gift-tip-note {
            font-size: 12px;
            color: #7c8598;
            font-style: italic;
            margin-top: 10px;
        }

        body.dark .gift-tip {
            background: #1b2148;
            border-color: #3a4488;
        }

        body.dark .gift-tip-d {
            color: #e5e9ff;
        }

        .gift-confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 99999;
        }

        .gift-confetti i {
            position: absolute;
            top: -24px;
            opacity: .95;
            box-shadow: 0 0 4px rgba(0, 0, 0, .12);
            animation: gcFall linear forwards;
        }

        @keyframes gcFall {
            0% {
                transform: translateY(-24px) translateX(0) rotate(0)
            }

            100% {
                transform: translateY(104vh) translateX(var(--x)) rotate(var(--r))
            }
        }

        .ovl-card h3 {
            font-family: 'Baloo 2';
            color: var(--indigo);
            margin: 4px 0 8px;
            font-size: 22px;
        }

        .quiz-q {
            font-size: 15px;
            color: #334155;
            margin: 0 0 14px;
            line-height: 1.5;
        }

        .quiz-opts {
            display: grid;
            gap: 9px;
        }

        .quiz-opt {
            background: var(--indigo-soft);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            color: var(--ink);
            transition: .12s;
        }

        .quiz-opt:hover:not(:disabled) {
            background: #e2e5ff;
        }

        .quiz-opt.ok {
            background: #22c55e;
            color: #fff;
        }

        .quiz-opt.no {
            background: #ef4444;
            color: #fff;
        }

        .quiz-opt:disabled {
            cursor: default;
        }

        .quiz-exp {
            display: none;
            margin-top: 12px;
            background: #f1f4ff;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13.5px;
            color: var(--indigo);
            line-height: 1.5;
            text-align: left;
        }

        .quiz-next {
            margin-top: 14px;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font: 700 15px 'Baloo 2';
            background: linear-gradient(120deg, #4f46e5, #7c3aed);
            color: #fff;
            cursor: pointer;
        }

        /* ===== PANEL ===== */
        .g-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #eef1ff, #f7f8ff);
            border: 1.5px solid #c7d0f5;
            border-radius: 20px;
            padding: 16px 14px 14px;
            box-shadow: 0 16px 36px -18px rgba(79, 70, 229, .42), inset 0 1px 0 #fff;
            position: relative;
        }

        .g-panel::before {
            content: '🎛️ Bảng điều khiển';
            position: absolute;
            top: -11px;
            left: 16px;
            background: linear-gradient(120deg, #4f46e5, #7c3aed);
            color: #fff;
            font: 800 11px 'Baloo 2';
            padding: 3px 12px;
            border-radius: 999px;
            letter-spacing: .3px;
            box-shadow: 0 5px 12px -4px rgba(79, 70, 229, .6);
        }

        body.dark .g-panel {
            background: linear-gradient(180deg, #1b2048, #161a38);
            border-color: #2c356e;
            box-shadow: 0 16px 36px -18px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .05);
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 10px 26px -20px rgba(31, 41, 110, .5);
        }

        .card h3 {
            margin: 0 0 8px;
            font-family: 'Baloo 2';
            font-size: 14px;
            color: var(--muted);
            font-weight: 700;
        }

        .eq-box {
            background: #0f1330;
            color: #fff;
            border-radius: 12px;
            padding: 14px;
            font-size: 20px;
            text-align: center;
            font-family: 'Baloo 2';
            letter-spacing: .3px;
        }

        .eq-box .c1 {
            color: #a5b4fc;
        }

        .eq-box .c2 {
            color: #7dd3fc;
        }

        .eq-box .c3 {
            color: #fcd34d;
        }

        .eq-box .sq {
            position: relative;
        }

        .eq-box .sup {
            font-size: .62em;
            vertical-align: super;
        }

        .mfrac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            margin: 0 3px;
        }

        .mfrac .mnum {
            border-bottom: 2px solid currentColor;
            padding: 0 4px;
            line-height: 1.1;
        }

        .mfrac .mden {
            padding: 0 4px;
            line-height: 1.1;
        }

        .mrad {
            border-top: 1.6px solid currentColor;
            padding: 0 2px;
        }

        .props {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .prop {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .prop .pk {
            font-size: 10.5px;
            color: var(--muted);
            font-weight: 600;
        }

        .prop .pv {
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
            margin-top: 1px;
        }

        .prop .pv .c1 {
            color: var(--c1);
        }

        .prop .pv .c2 {
            color: var(--c2);
        }

        .prop .pv .c3 {
            color: var(--c3);
        }

        .prog-wrap {}

        .prog-top {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .prog-bar {
            height: 10px;
            background: #eceffb;
            border-radius: 999px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            transition: width .25s, background .25s;
        }

        .sld-row {
            margin-bottom: 12px;
        }

        .sld-row:last-child {
            margin-bottom: 0;
        }

        .sld-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .sld-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink);
        }

        .sld-val {
            font: 800 15px 'Baloo 2';
            color: var(--indigo);

        /* ---------- tiện ích ---------- */
        function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }
        function dchk(d, R) { return Math.abs(d - R) < 1e-6 ? '✔ Có' : (d < R ? 'Nằm trong' : 'Nằm ngoài'); }
        function cval(a, b) { const c = a * a - b * b; return c >= 0 ? (Number.isInteger(Math.sqrt(c)) ? '' + Math.sqrt(c) : Math.sqrt(c).toFixed(2)) : '—'; }
        function tval(a, b) { const c = a * a - b * b; return c >= 0 ? (Number.isInteger(Math.sqrt(c)) ? '' + (2 * Math.sqrt(c)) : (2 * Math.sqrt(c)).toFixed(2)) : '—'; }
        function frac(n, d) { return '<span class="mfrac"><span class="mnum">' + n + '</span><span class="mden">' + d + '</span></span>'; }
        function barPass(d, R) { const off = Math.abs(d - R); const pct = clamp(100 - off * 20, 0, 100); return { label: off < 1e-6 ? '✔ Đi qua đúng điểm!' : ('Còn lệch ' + (Math.round(off * 100) / 100)), pct }; }
        function barErr(e, max) { const pct = clamp(100 - e / max * 100, 0, 100); return { label: e < 1e-6 ? '✔ Khớp hoàn toàn!' : ('Độ lệch ' + (Math.round(e * 100) / 100)), pct }; }

                    if (L.mode === 'circle') {
                        const R = L.target.R != null ? L.target.R : (vals.R || 0);
                        const cx = (L.center && L.center.x != null) ? L.center.x : (L.target.a != null ? L.target.a : (vals.a || 0));
                        const cy = (L.center && L.center.y != null) ? L.center.y : (L.target.b != null ? L.target.b : (vals.b || 0));

                    const d = dedup4(cor, [coord(0, e.c), coord(e.a, 0), coord(e.c, e.c), coord(-e.c, e.c), coord(e.b, 0)]);
                    return {
                        topic: 'tieuElip', q: 'Elip ' + elHTML(e.a * e.a, e.b * e.b) + ' có một tiêu điểm là?', opts: d.opts, ci: d.ci,
                        exp: 'Tiêu điểm F(±c; 0) với c=√(a' + sup('2') + '−b' + sup('2') + ')=' + e.c + '. Một tiêu điểm là ' + coord(e.c, 0) + '.'
                    };
                },
                tiepXuc() {
                    const R = ri(2, 5); const a = 0, b = 0; const cor = circHTML(0, R, R * R);
                    const d = dedup4(cor, [circHTML(0, 0, R * R), circHTML(R, 0, R * R), circHTML(0, R, R), circHTML(0, -R, R * R)]);
                    return {
                        topic: 'vietTron', q: 'Đường tròn tâm I(0; ' + R + ') tiếp xúc trục Ox có phương trình là?', opts: d.opts, ci: d.ci,
                        exp: 'Tiếp xúc Ox ⟹ R = |y_I| = ' + R + '. Phương trình: x' + sup('2') + '+(y−' + R + ')' + sup('2') + '=' + R * R + '.'
                    };
                },
            };

            /* ---------- PHẦN II — ĐÚNG/SAI (2 câu, mỗi câu 4 ý trên MỘT đối tượng) ---------- */
            function makeTF() {
                const items = [];
                { // câu 13: về một đường tròn
                    const c = randCirc(); const R2 = c.R * c.R;
                    const onP = { x: c.a + c.R, y: c.b }; const cutOx = c.b * c.b < R2;
                    items.push({
                        stem: 'Cho đường tròn (C): ' + circHTML(c.a, c.b, R2) + '.',
                        subs: [
                            { t: 'Đường tròn có tâm I' + coord(c.a, c.b) + '.', a: true },
                            { t: 'Đường tròn có bán kính R = ' + R2 + '.', a: false, why: 'R=√' + R2 + '=' + c.R + ', không phải ' + R2 + '.' },
                            { t: 'Điểm M' + coord(onP.x, onP.y) + ' thuộc (C).', a: true },
                            { t: 'Đường tròn ' + (cutOx ? 'cắt' : 'không cắt') + ' trục Ox.', a: true }
                        ]
                    });
                }
                { // câu 14: về một elip
                    const e = randEl();
                    items.push({
                        stem: 'Cho elip (E): ' + elHTML(e.a * e.a, e.b * e.b) + '.',
                        subs: [
                            { t: 'Elip có độ dài trục lớn bằng ' + 2 * e.a + '.', a: true },
                            { t: 'Elip có tiêu cự bằng ' + 2 * e.c + '.', a: true },
                            { t: 'Elip có hai tiêu điểm nằm trên trục Oy.', a: false, why: 'Vì a>b nên tiêu điểm nằm trên trục Ox.' },
                            { t: 'Điểm ' + coord(e.a, 0) + ' là một đỉnh của elip.', a: true }
                        ]
                    });
                }
                return items;
            }

            /* ---------- PHẦN III — NỐI CỘT (6 ý trên MỘT elip) ---------- */
            function makeMatch() {
                const e = randEl();
                const A = [
                    { k: 'Độ dài trục lớn', v: '' + (2 * e.a) },
                    { k: 'Độ dài trục nhỏ', v: '' + (2 * e.b) },
                    { k: 'Tiêu cự (2c)', v: '' + (2 * e.c) },
                    { k: 'Toạ độ tiêu điểm F₂', v: coord(e.c, 0) },
                    { k: 'Toạ độ đỉnh trên trục lớn', v: coord(e.a, 0) },
                    { k: 'Giá trị c² = a² − b²', v: '' + (e.c * e.c) }
                ];
                return { stem: 'Cho elip (E): ' + elHTML(e.a * e.a, e.b * e.b) + '. Nối mỗi yếu tố ở cột A với giá trị đúng ở cột B.', A };
            }

            /* ---------- PHẦN IV — TRẢ LỜI NGẮN (4 câu VD/VDC, có hình) ---------- */
            function figCircle(a, b, R) { // SVG minh hoạ có hệ trục Oxy + mũi tên
                const S = 140, cx = 64, cy = 76, u = 40 / Math.max(R, 3), id = 'ar' + Math.floor(Math.random() * 1e6);
                return '<svg xmlns="http://www.w3.org/2000/svg" width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '">' +
                    '<defs><marker id="' + id + '" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/></marker></defs>' +
                    '<line x1="8" y1="' + cy + '" x2="' + (S - 5) + '" y2="' + cy + '" stroke="#64748B" stroke-width="1.2" marker-end="url(#' + id + ')"/>' +
                    '<line x1="' + cx + '" y1="' + (S - 6) + '" x2="' + cx + '" y2="5" stroke="#64748B" stroke-width="1.2" marker-end="url(#' + id + ')"/>' +
                    '<text x="' + (S - 9) + '" y="' + (cy - 5) + '" font-size="10" font-style="italic" fill="#334155">x</text>' +
                    '<text x="' + (cx + 5) + '" y="13" font-size="10" font-style="italic" fill="#334155">y</text>' +
                    '<text x="' + (cx - 10) + '" y="' + (cy + 12) + '" font-size="10" fill="#334155">O</text>' +
                    '<circle cx="' + (cx + a * u) + '" cy="' + (cy - b * u) + '" r="' + (R * u) + '" fill="rgba(107,123,214,.12)" stroke="#2A3B8F" stroke-width="2"/>' +
                    '<circle cx="' + (cx + a * u) + '" cy="' + (cy - b * u) + '" r="2.6" fill="#E8792B"/></svg>';
            }
            function figBridge() {
                const id = 'ab' + Math.floor(Math.random() * 1e6);
                return '<svg xmlns="http://www.w3.org/2000/svg" width="170" height="96" viewBox="0 0 170 96">' +
                    '<defs><marker id="' + id + '" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/></marker></defs>' +
                    '<path d="M22 78 A63 58 0 0 1 148 78" fill="rgba(42,111,219,.08)" stroke="#2A6FDB" stroke-width="2.5"/>' +
                    '<line x1="8" y1="78" x2="165" y2="78" stroke="#64748B" stroke-width="1.2" marker-end="url(#' + id + ')"/>' +
                    '<line x1="85" y1="92" x2="85" y2="6" stroke="#64748B" stroke-width="1.2" marker-end="url(#' + id + ')"/>' +
                    '<line x1="85" y1="78" x2="85" y2="20" stroke="#94A3B8" stroke-dasharray="3 3"/>' +
                    '<text x="158" y="74" font-size="10" font-style="italic" fill="#334155">x</text>' +
                    '<text x="90" y="14" font-size="10" font-style="italic" fill="#334155">y</text>' +
                    '<text x="73" y="90" font-size="10" fill="#334155">O</text>' +
                    '<text x="90" y="26" font-size="9" fill="#334155">h</text></svg>';
            }
            function makeShort() {
                const arr = [];
                {
                    const I = { x: ri(-3, 3), y: ri(-3, 3) }, A = { x: I.x + ri(3, 5), y: I.y + ri(0, 4) }; const R = Math.round(Math.hypot(A.x - I.x, A.y - I.y));
                    // đảm bảo R nguyên: chọn A pythagore
                    const trip = pick([[3, 4], [4, 3], [6, 8], [8, 6], [5, 12], [12, 5]]); const A2 = { x: I.x + trip[0], y: I.y + trip[1] }; const R2 = Math.round(Math.hypot(trip[0], trip[1]));
                    arr.push({
                        no: 16, q: 'Đường tròn tâm I' + coord(I.x, I.y) + ' đi qua A' + coord(A2.x, A2.y) + '. Tính bán kính R.', ans: '' + R2,
                        fig: figCircle(I.x, I.y, R2), sol: 'R = IA = √((' + trip[0] + ')' + sup('2') + '+(' + trip[1] + ')' + sup('2') + ') = ' + R2 + '.'
                    });
                }
                {
                    const c = randCirc(); const D = -2 * c.a, E = -2 * c.b, F = c.a * c.a + c.b * c.b - c.R * c.R;
                    const term = (co, v) => co === 0 ? '' : (co > 0 ? ' + ' + co + v : ' - ' + Math.abs(co) + v);
                    arr.push({
                        no: 17, q: 'Cho đường tròn \\(x^{2} + y^{2}' + term(D, 'x') + term(E, 'y') + term(F, '') + ' = 0\\). Tính bán kính R.', ans: '' + c.R,
                        sol: 'R = √((D/2)' + sup('2') + '+(E/2)' + sup('2') + '−F) = √(' + c.a * c.a + '+' + c.b * c.b + '−(' + F + ')) = ' + c.R + '.'
                    });
                }
                {
                    const e = randEl(); arr.push({
                        no: 18, q: 'Elip ' + elHTML(e.a * e.a, e.b * e.b) + ' làm quỹ đạo vệ tinh. Tính khoảng cách giữa hai tiêu điểm.', ans: '' + (2 * e.c),
                        sol: 'c = √(a' + sup('2') + '−b' + sup('2') + ') = √(' + e.a * e.a + '−' + e.b * e.b + ') = ' + e.c + '. Khoảng cách hai tiêu điểm = 2c = ' + 2 * e.c + '.'
                    });
                }
                { // thực tế: cầu vòm bán elip
                    const e = pick(ELS); const width = 2 * e[0], height = e[1];
                    const xq = e[0] / 2; const yq = (e[1] * Math.sqrt(1 - (xq * xq) / (e[0] * e[0]))); const yr = Math.round(yq * 100) / 100;
                    arr.push({
                        no: 19, q: 'Cổng vòm hình nửa elip rộng ' + width + ' m, cao ' + height + ' m (nửa trên của elip ' + elHTML(e[0] * e[0], e[1] * e[1]) + '). Tính chiều cao của vòm tại điểm cách tâm ' + xq + ' m (làm tròn 2 chữ số).', ans: '' + yr,
                        fig: figBridge(), sol: 'Thay x=' + xq + ' vào y=b·√(1−x' + sup('2') + '/a' + sup('2') + ')=' + e[1] + '·√(1−' + (xq * xq) + '/' + e[0] * e[0] + ') ≈ ' + yr + ' m.'
                    });
                }
                return arr;
            }

            /* ---------- BỘ SINH TỔNG (tính MỌI dữ liệu suy diễn ngay tại đây) ---------- */
            const NB_KEYS = Object.keys(NB), TH_KEYS = Object.keys(TH);
            function pickNB(scope) {
                let pool = NB_KEYS.slice();
                if (scope && scope.length) { const inS = NB_KEYS.filter(k => scope.includes(k)); if (inS.length) pool = inS; }
                const sh = shuf(pool), chosen = [];
                for (let i = 0; i < 8; i++) chosen.push(NB[sh[i % sh.length]]);
                return shuf(chosen);
            }
            function generateWorksheet(scope) {
                const partI = [];
                pickNB(scope).forEach(g => partI.push(g()));
                shuf(TH_KEYS).slice(0, 4).forEach(k => partI.push(TH[k]()));
                // ép mỗi câu có đúng ci hợp lệ
                partI.forEach(it => { if (typeof it.ci !== 'number' || it.ci < 0) it.ci = 0; });
                const tf = makeTF();
                const match = makeMatch();
                // cột B xáo trộn — TÍNH NGAY TRONG generateWorksheet
                const bVals = match.A.map((x, i) => ({ v: x.v, orig: i }));
                const bShuffled = shuf(bVals);
                match.bShuffled = bShuffled;
                match.answerKey = match.A.map((x, i) => { const pos = bShuffled.findIndex(b => b.orig === i); return String.fromCharCode(65) + (pos + 1); }); // A→ B? (dùng số)
                // đáp án nối: mỗi A_i nối với vị trí trong B
                match.pairKey = match.A.map((x, i) => bShuffled.findIndex(b => b.orig === i) + 1);
                const short = makeShort();
                const code = C.makeCode();
                return { code, partI, tf, match, short, at: Date.now() };
            }
            C.generateWorksheet = generateWorksheet;
            window.__sctws = { generateWorksheet, dedup4 };
        })();

    </script>

            /* ---------- PHIẾU TRẢ LỜI (bố cục = khung đáp án, ô trống) ---------- */

            /* ---------- ĐÁP ÁN & HƯỚNG DẪN CHẤM ---------- */
            function buildWsKeyPage(ws) {

            function svgPie(data, size) {

                    const x1 = cx + r * Math.cos(a), y1 = cy + r * Math.sin(a), x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
                    const large = ang > Math.PI ? 1 : 0;

    <script>
        /* ===== SKKN module: skkn8.js ===== */
        /* =====================================================================
           PART 8 — THI ĐẤU 2 NGƯỜI + ĐỒNG HỒ ĐẾM NGƯỢC + GIỌNG ĐỌC ĐỀ (TTS)
           ===================================================================== */
        (function () {
            'use strict';
            const C = window.__sctcore, { $, shuf, esc, toast } = C;
            const ABC = ['A', 'B', 'C', 'D'];
            const DUEL_TIME = 20;

            /* ---------- TTS: HTML/math → tiếng Việt ---------- */
            function texToSpeech(t) {
                return String(t)
                    .replace(/<span class="mfrac"><span class="mnum">([\s\S]*?)<\/span><span class="mden">([\s\S]*?)<\/span><\/span>/g, ' $1 phần $2 ')
                    .replace(/<span class="msqrt">√<span class="mrad">([\s\S]*?)<\/span><\/span>/g, ' căn bậc hai của $1 ')
                    .replace(/<sup>2<\/sup>/g, ' bình phương ')
                    .replace(/<sup>([\s\S]*?)<\/sup>/g, ' mũ $1 ')
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/√/g, ' căn ').replace(/²/g, ' bình phương ')
                    .replace(/[{}()]/g, ' ').replace(/;/g, ' phẩy ').replace(/=/g, ' bằng ')
                    .replace(/\+/g, ' cộng ').replace(/[−-]/g, ' trừ ').replace(/\//g, ' phần ')
                    .replace(/\s+/g, ' ').trim();

                for (let k = 0; k < 3 && out.length < n + 4; k++) {
                    const ws = C.generateWorksheet(null);

                }

                // xáo trộn phương án từng câu
                const picked = shuf(out).slice(0, n).map(o => { const idx = o.opts.map((_, i) => i); const sh = shuf(idx); return { q: o.q, opts: sh.map(i => o.opts[i]), c: sh.indexOf(o.c) }; });
                return picked;
            }

            let duel = null, dTimer = null, autoRead = false;
            function clearDuelTimer() { if (dTimer) { clearInterval(dTimer); dTimer = null; } }

            function renderSetup() {

                    '<p style="color:var(--muted);margin:0 0 14px">Nhập tên 2 người chơi. Mỗi người trả lời <b>5 câu</b> luân phiên; ai đúng nhiều hơn sẽ thắng!</p>' +
                    '<div class="duel-vs"><div class="duel-p p1"><div class="dp-ic">🚀</div><input class="t-in" id="dName1" placeholder="Người chơi 1" value="Người chơi 1"></div>' +
                    '<div class="duel-x">VS</div>' +
                    '<div class="duel-p p2"><div class="dp-ic">🛸</div><input class="t-in" id="dName2" placeholder="Người chơi 2" value="Người chơi 2"></div></div>' +

            }
            function startDuel(n1, n2) {
                duel = { names: [n1, n2], score: [0, 0], qs: duelBank(10), turn: 0, round: 0 };
                renderPlay();
            }
            C.startDuel = startDuel;
            function renderPlay() {
                clearDuelTimer();
                if (duel.round >= 10) { return renderResult(); }
                const player = duel.turn, q = duel.qs[duel.round];
                const roundOfPlayer = Math.floor(duel.round / 2) + 1;
                let h = '<div class="duel-head"><span class="dh1">🚀 ' + esc(duel.names[0]) + ': <b>' + duel.score[0] + '</b></span>' +
                    '<span class="dh-mid">Vòng ' + roundOfPlayer + '/5</span>' +
                    '<span class="dh2">🛸 ' + esc(duel.names[1]) + ': <b>' + duel.score[1] + '</b></span></div>';
                h += '<div class="duel-turn"><span class="dt-badge p' + player + '">Lượt của ' + esc(duel.names[player]) + '</span>' +
                    '<button class="dt-btn" id="dRead">🔊 Đọc đề</button><button class="dt-btn" id="dAuto">🎧 Tự đọc: ' + (autoRead ? 'BẬT' : 'TẮT') + '</button></div>';
                h += '<div class="duel-bar"><i id="dBar"></i></div><div class="duel-sec" id="dSec">' + DUEL_TIME + 's</div>';
                h += '<p class="duel-q">' + q.q + '</p><div class="pp-opts" id="dOpts">';
                q.opts.forEach((o, j) => h += '<button class="pp-opt" data-j="' + j + '"><b>' + ABC[j] + '.</b> ' + o + '</button>');
                h += '</div>';
                $('duelBody').innerHTML = h;
                window.SCT_typeset && window.SCT_typeset($('duelBody'));   // render công thức toán trong đấu 2 người
                $('dRead').onclick = () => speak(q.q);
                $('dAuto').onclick = () => { autoRead = !autoRead; $('dAuto').textContent = '🎧 Tự đọc: ' + (autoRead ? 'BẬT' : 'TẮT'); if (autoRead) speak(q.q); };
                $('dOpts').querySelectorAll('.pp-opt').forEach(b => b.onclick = () => answer(+b.dataset.j, q));
                if (autoRead) speak(q.q);
                startDuelTimer(q);
            }
            function startDuelTimer(q) {
                let left = DUEL_TIME; const bar = $('dBar'), sec = $('dSec');
                function upd() { const pct = left / DUEL_TIME * 100; if (bar) { bar.style.width = pct + '%'; bar.style.background = left <= 5 ? '#E11D48' : left <= 10 ? '#F59E0B' : '#1FA36B'; } if (sec) sec.textContent = left + 's'; }
                upd();
                dTimer = setInterval(() => { left--; upd(); if (left <= 0) { clearDuelTimer(); answer(-1, q); } }, 1000);
            }
            C.startDuelTimer = startDuelTimer;
            function answer(j, q) {
                clearDuelTimer();
                const opts = $('dOpts').querySelectorAll('.pp-opt');
                opts.forEach(x => { x.disabled = true; if (+x.dataset.j === q.c) x.classList.add('ok'); });
                if (j === q.c) { duel.score[duel.turn]++; if (opts[j]) opts[j].classList.add('ok'); }
                else if (j >= 0 && opts[j]) opts[j].classList.add('no');
                setTimeout(() => { duel.round++; duel.turn = 1 - duel.turn; renderPlay(); }, 1100);
            }
            function renderResult() {
                clearDuelTimer();
                const [s1, s2] = duel.score; const win = s1 > s2 ? 0 : s2 > s1 ? 1 : -1;

                h += '<h2 style="color:var(--indigo);margin:6px 0">' + (win < 0 ? 'Hoà!' : ('🎉 ' + esc(duel.names[win]) + ' chiến thắng!')) + '</h2>';
                h += '<div class="duel-final"><div class="df p0">' + esc(duel.names[0]) + '<b>' + s1 + '</b></div><div class="df-vs">—</div><div class="df p1">' + esc(duel.names[1]) + '<b>' + s2 + '</b></div></div>';
                h += '<button class="duel-start" id="dAgain">⚔️ Đấu lại</button></div>';
                $('duelBody').innerHTML = h;
                $('dAgain').onclick = () => renderSetup();
            }
            C.clearDuelTimer = clearDuelTimer;
            window.__sctduel = { openDuel, startDuel, speak };
        })();

    </script>
    <script>
        /* ===== SKKN module: skkn9.js ===== */

            function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

                g.fillStyle = '#6A7184'; g.font = '600 11px Nunito,sans-serif'; g.fillText('Giáo viên phụ trách', cx, y + 45);

            function drawCert(name, cls, school, s) {
                const W = 1000, H = 707, dpr = 2;

                const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);

                        const sx = c[1] === 'l' ? 1 : -1, sy = c[0] === 't' ? 1 : -1; g.beginPath(); g.moveTo(x, y + sy * 26); g.lineTo(x, y); g.lineTo(x + sx * 26, y); g.stroke(); g.restore();

            function solveSteps(i) {
                let lv = null; try { lv = (typeof LEVELS !== 'undefined') ? LEVELS[i] : null; } catch (e) { }
                if (lv && lv.solSteps && lv.solSteps.length) return lv.solSteps.map(s => ({ t: s.t, d: s.d }));

            }
            function solMath(d) {
                d = String(d);
                // 1) elip chính tắc: x²/A + y²/B = 1
                d = d.replace(/x²\/(\d+)\s*\+\s*y²\/(\d+)\s*=\s*1/g, (m, a, b) => '\\(\\dfrac{x^{2}}{' + a + '}+\\dfrac{y^{2}}{' + b + '}=1\\)');
                // 2) đường tròn: (x±a)² + (y±b)² = N  (mọi biến thể, kể cả x² hoặc y² trơn)
                d = d.replace(/\(?x([−\-+]\d+)?\)?²\s*\+\s*\(?y([−\-+]\d+)?\)?²\s*=\s*(\d+)/g, (m, a, b, n) => {
                    const xp = a ? ('(x' + a.replace('−', '-') + ')^{2}') : 'x^{2}';
                    const yp = b ? ('(y' + b.replace('−', '-') + ')^{2}') : 'y^{2}';
                    return '\\(' + xp + '+' + yp + '=' + n + '\\)';
                });
                // 3) đường tròn khai triển: x² + y² + ... = 0 (giữ nguyên phần hệ số, chỉ nâng mũ)
                d = d.replace(/x²\s*\+\s*y²/g, '\\(x^{2}+y^{2}\\)');
                // 4) căn: √( ... ) và √N
                d = d.replace(/√\(([^)]*)\)/g, (m, i2) => '\\(\\sqrt{' + i2.replace(/²/g, '^{2}').replace(/−/g, '-') + '}\\)');
                d = d.replace(/√(\d+)/g, (m, n) => '\\(\\sqrt{' + n + '}\\)');
                // 5) phân số tổng quát: (…)/n · chữ/n · số/n  → \dfrac
                d = d.replace(/\(([^()]+)\)\/(\d+)/g, (m, num, den) => '\\(\\dfrac{' + num.replace(/²/g, '^{2}').replace(/−/g, '-') + '}{' + den + '}\\)');
                d = d.replace(/(\d*[A-Za-z]{1,3})\/(\d+)/g, (m, num, den) => '\\(\\dfrac{' + num + '}{' + den + '}\\)');
                d = d.replace(/(\d+)\/(\d+)/g, (m, num, den) => '\\(\\dfrac{' + num + '}{' + den + '}\\)');
                // 6) chỉ số dưới của tiêu điểm / hệ số
                d = d.replace(/F₂/g, '\\(F_{2}\\)').replace(/F₁/g, '\\(F_{1}\\)');
                // 7) mũ ² còn sót (đứng lẻ trong văn xuôi) → giữ superscript unicode (không đụng)
                // gộp các \(...\)\(...\) liền kề để MathJax gọn hơn
                d = d.replace(/\\\)\s*\\\(/g, ' ');
                return d;
            }

                    '<div class="key-note" style="margin-top:12px"><div class="qrbox">' + qrSVG(QR_URL, 78) + '</div><div class="kt">📱 Mở "Trạm Vệ Tinh" để luyện tập thêm.</div></div></div>';

        /* ===== SKKN module: skkn10w.js ===== */
        /* =====================================================================
           PART 10w — PHIẾU VỀ ĐÍCH TƯƠNG TÁC (chấm /10 để đạt điều kiện chứng nhận)
           ===================================================================== */
        (function () {
            'use strict';
            const C = window.__sctcore, { $, esc, toast } = C;
            const ABC = ['A', 'B', 'C', 'D'];
            let bestWs = 0, curWS = null;
            window.SCT_bestWs = () => bestWs;
            window.SCT_wsPassed = () => bestWs > 8;
            window.SCT_setBestWs = function (v) { bestWs = Math.max(bestWs, v || 0); };

            function openPlayWS() {
                C.showModal('mPlayWS');
                curWS = C.generateWorksheet(window.SCT_teacherScope ? window.SCT_teacherScope() : null);
                renderForm();
            }
            C.openPlayWS = openPlayWS;

            function renderForm() {
                const w = curWS; let h = '<div class="pw-intro">📝 Trả lời các phần dưới đây rồi bấm <b>Nộp bài</b>. Thang điểm 10 · mỗi lần mở là một đề khác.</div>';
                // Phần I
                h += '<div class="pw-sec s1"><div class="pw-h">Phần I — Trắc nghiệm (3đ)</div>';
                w.partI.forEach((it, i) => {
                    h += '<div class="pw-q"><div class="pw-qt"><b>Câu ' + (i + 1) + '.</b> ' + it.q + '</div><div class="pw-opts">' +
                    it.opts.map((o, j) => '<label class="pw-op"><input type="radio" name="pi' + i + '" value="' + j + '"> <b>' + ABC[j] + '.</b> ' + o + '</label>').join('') + '</div></div>';
                });
                h += '</div>';
                // Phần II
                h += '<div class="pw-sec s2"><div class="pw-h">Phần II — Đúng/Sai (2đ)</div>';
                w.tf.forEach((t, i) => {
                    h += '<div class="pw-q"><div class="pw-qt"><b>Câu ' + (13 + i) + '.</b> ' + t.stem + '</div>';
                    t.subs.forEach((s, j) => { h += '<div class="pw-tf"><span>' + 'abcd'[j] + ') ' + s.t + '</span><span class="pw-tfsel"><label><input type="radio" name="pii' + i + '_' + j + '" value="1"> Đúng</label> <label><input type="radio" name="pii' + i + '_' + j + '" value="0"> Sai</label></span></div>'; });
                    h += '</div>';
                });
                h += '</div>';
                // Phần III
                h += '<div class="pw-sec s3"><div class="pw-h">Phần III — Nối cột (3đ)</div><div class="pw-qt">' + w.match.stem + '</div>';
                h += '<div class="pw-match"><div class="pw-col"><b>Cột B (chọn số):</b><br>' + w.match.bShuffled.map((b, i) => '<div class="pw-bitem"><b>' + (i + 1) + '.</b> ' + b.v + '</div>').join('') + '</div><div class="pw-col">';
                w.match.A.forEach((a, i) => { h += '<div class="pw-arow"><span><b>A' + (i + 1) + '.</b> ' + a.k + '</span> → <select name="piii' + i + '"><option value="">?</option>' + [1, 2, 3, 4, 5, 6].map(n => '<option value="' + n + '">' + n + '</option>').join('') + '</select></div>'; });
                h += '</div></div></div>';
                // Phần IV
                h += '<div class="pw-sec s4"><div class="pw-h">Phần IV — Trả lời ngắn (2đ)</div>';
                w.short.forEach((s, i) => { h += '<div class="pw-q"><div class="pw-qt"><b>Câu ' + s.no + '.</b> ' + s.q + '</div>' + (s.fig ? '<div class="pw-fig">' + s.fig + '</div>' : '') + '<input class="pw-in" name="piv' + i + '" placeholder="Đáp án của em"></div>'; });
                h += '</div>';
                h += '<button class="pw-submit" id="pwSubmit">✅ Nộp bài & chấm điểm</button>';
                $('pwBody').innerHTML = h; window.SCT_typeset && window.SCT_typeset($('pwBody'));
                $('pwSubmit').onclick = grade;
            }
            function val(name) { const el = $('pwBody').querySelector('input[name="' + name + '"]:checked'); return el ? el.value : null; }
            function grade() {
                const w = curWS; let pts = 0; const detail = [];
                // Phần I: 0.25/câu
                let pi = 0; w.partI.forEach((it, i) => { const v = val('pi' + i); if (v != null && +v === it.ci) { pts += 0.25; pi++; } });
                // Phần II: 0.25/ý
                let pii = 0; w.tf.forEach((t, i) => { t.subs.forEach((s, j) => { const v = val('pii' + i + '_' + j); if (v != null && (+v === 1) === s.a) { pts += 0.25; pii++; } }); });
                // Phần III: 0.5/ý
                let piii = 0; w.match.A.forEach((a, i) => { const sel = $('pwBody').querySelector('select[name="piii' + i + '"]'); const v = sel ? sel.value : ''; if (v && +v === w.match.pairKey[i]) { pts += 0.5; piii++; } });
                // Phần IV: 0.5/câu (so khớp số)
                let piv = 0; w.short.forEach((s, i) => { const el = $('pwBody').querySelector('input[name="piv' + i + '"]'); const v = (el ? el.value : '').replace(',', '.').trim(); if (v !== '' && Math.abs(parseFloat(v) - parseFloat(s.ans)) < 0.02) { pts += 0.5; piv++; } });
                pts = Math.round(pts * 100) / 100;
                bestWs = Math.max(bestWs, Math.round(pts));
                // hiển thị kết quả + lời giải
                let h = '<div class="pw-result"><div style="font-size:46px">' + (pts >= 8 ? '🎉' : pts >= 5 ? '👍' : '💪') + '</div><h2 style="color:var(--indigo);margin:6px 0">Điểm của em: ' + pts + '/10</h2>' +
                    '<div class="pw-break">Phần I: ' + pi + '/12 · Phần II: ' + pii + '/8 · Phần III: ' + piii + '/6 · Phần IV: ' + piv + '/4</div>' +
                    (pts > 8 ? '<div class="pw-pass">✅ Đạt yêu cầu Phiếu Về Đích! Hãy làm Kiểm tra đầu ra để nhận Giấy chứng nhận.</div>' : '<div class="pw-fail">Cần > 8/10 để đạt điều kiện chứng nhận. Xem lời giải rồi thử đề mới nhé!</div>') + '</div>';
                h += '<div class="pw-sol"><b>💡 Đáp án Phần I:</b> ' + w.partI.map((it, i) => (i + 1) + ABC[it.ci]).join(' · ') + '</div>';
                h += '<div class="pw-sol"><b>Phần IV — lời giải:</b><ul>' + w.short.map(s => '<li>Câu ' + s.no + ' (' + s.ans + '): ' + s.sol + '</li>').join('') + '</ul></div>';
                h += '<div style="display:flex;gap:8px;margin-top:10px"><button class="t-go" id="pwAgain" style="flex:1">🔁 Đề mới</button><button class="t-go" id="pwDone" style="flex:1;background:#1FA36B">' + (pts > 8 ? '🏆 Làm Kiểm tra đầu ra →' : 'Xong') + '</button></div>';
                $('pwBody').innerHTML = h; window.SCT_typeset && window.SCT_typeset($('pwBody'));
                $('pwAgain').onclick = () => { curWS = C.generateWorksheet(window.SCT_teacherScope ? window.SCT_teacherScope() : null); renderForm(); };
                $('pwDone').onclick = () => {
                    C.hideModal('mPlayWS'); if (window.SCT_updateBadges) window.SCT_updateBadges();
                    // Đạt Phiếu Về Đích → dẫn thẳng tới 8 câu Kiểm tra đầu ra
                    if (pts > 8 && window.__sctpp && window.__sctpp.openTest && window.__sctpp.startTest) {
                        window.__sctpp.openTest();
                        window.__sctpp.startTest('post');
                    }
                };
                if (pts > 8) toast('Đạt Phiếu Về Đích ' + Math.round(pts) + '/10!');
            }
            window.__sctplayws = { openPlayWS };
        })();

    </script>

                '<button class="foot-btn duel" id="tDuel">⚔️ Đấu 2 người</button>' +
                '<button class="foot-btn test" id="tPre">✏️ Kiểm tra</button>' +
                '<button class="foot-btn hist" id="tHist">📊 Lịch sử tham gia</button>' +
                '<button class="foot-btn ver" id="tVer">🚀 Phiên bản: v4.0</button>';
            if (wrap && footer) wrap.insertBefore(tools, footer); else if (wrap) wrap.appendChild(tools);
            (function () { var tc = document.querySelector('.sct-timer'); if (tc) { tools.appendChild(tc); } })();
            $('tDuel').onclick = () => C.openDuel();
            $('tPre').onclick = () => C.openTest();
            $('tHist').onclick = () => C.openHistory();
            $('tVer').onclick = () => showModal('mVersion');
            if ($('solPDF')) $('solPDF').onclick = () => C.exportSolutionPDF();

            // ===== WELCOME (Học viện — bố cục như ảnh tham chiếu) =====
            function wcRow(ic, t, d, col) { return '<div class="wc-row"><span class="wc-ic" style="background:' + col + '22;color:' + col + '">' + ic + '</span><div><b>' + t + ':</b> ' + d + '</div></div>'; }
            function wcBanner() {
                return '<svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice">' +
                    '<defs><linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#243b8f"/></linearGradient>' +
                    '<radialGradient id="wsun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient></defs>' +
                    '<rect width="400" height="120" fill="url(#wsky)"/>' +
                    Array.from({ length: 40 }).map((_, i) => '<circle cx="' + ((i * 97) % 400) + '" cy="' + ((i * 53) % 120) + '" r="' + (0.6 + (i % 3) * 0.5) + '" fill="#fff" opacity="' + (0.4 + (i % 5) * 0.1) + '"/>').join('') +
                    '<circle cx="330" cy="34" r="20" fill="url(#wsun)"/>' +
                    '<ellipse cx="120" cy="70" rx="70" ry="26" fill="none" stroke="#7dd3fc" stroke-width="1.6" opacity=".5"/>' +
                    '<circle cx="120" cy="70" r="14" fill="#38bdf8" opacity=".9"/><circle cx="120" cy="70" r="14" fill="none" stroke="#bae6fd" stroke-width="1.4"/>' +
                    '<g transform="translate(190,44) rotate(25)"><rect x="-3" y="-3" width="14" height="10" rx="2" fill="#cbd5e1"/><rect x="-16" y="-1" width="12" height="5" fill="#60a5fa"/><rect x="11" y="-1" width="12" height="5" fill="#60a5fa"/></g>' +
                    '<path d="M120 70 Q 250 20 330 34" fill="none" stroke="#fcd34d" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8"/>' +
                    '</svg>';
            }
            let pendingStart = false;
            const welcome = document.createElement('div'); welcome.className = 'sct-welcome';
            welcome.innerHTML = '<div class="wc">' +
                '<div class="wc-banner">' + wcBanner() + '</div>' +
                '<h2>Học viện Trạm Vệ Tinh</h2>' +
                '<p class="wc-sub">Chinh phục 10 màn chơi rồi hoàn thành <b>Phiếu Về Đích ở Màn 11</b> để trở thành bậc thầy <b>Đường tròn &amp; Elip</b>!</p>' +
                '<div class="wc-rows">' +
                wcRow('🎯', 'Mục tiêu', 'điều chỉnh đường tròn / elip bằng thanh trượt hoặc <b>kéo chuột</b> để khớp đúng điều kiện (đi qua điểm, tiếp xúc, tiêu điểm…).', '#4f46e5') +
                wcRow('📝', 'Kiến thức', 'tâm &amp; bán kính, phương trình đường tròn, tiếp tuyến, trục lớn/nhỏ, tiêu cự &amp; tiêu điểm của elip.', '#0ea5e9') +
                wcRow('⭐', 'Ghi sao', 'khớp đúng ngay lần đầu được 3⭐. Mỗi màn có 1 câu hỏi củng cố kèm lời giải.', '#f59e0b') +
                wcRow('🏁', 'Về đích (Màn 11)', 'làm Phiếu bài tập tổng hợp 4 phần (10 điểm) — trắc nghiệm, đúng-sai, nối cột, trả lời ngắn; có chấm điểm &amp; hướng dẫn giải.', '#22c55e') +
                '</div>' +
                '<div class="wc-chips">' + ['Đường tròn', 'Tâm I(a;b)', 'Bán kính', 'Tiếp tuyến', 'Elip', 'Tiêu điểm - Trục'].map(c => '<span>' + c + '</span>').join('') + '</div>' +
                '<div class="wc-note">🏆 Hoàn thành ≥ 80% số màn (≥ 8/10) và đạt trên 8/10 điểm ở Phiếu Về Đích để nhận <b>Giấy Chứng Nhận mang tên bạn!</b></div>' +
                '<button class="wbtn wgo" id="wGo">🚀 Bắt đầu khám phá!</button>' +
                '<button class="wbtn wpre" id="wPre">📝 Làm Kiểm tra đầu vào (bắt buộc trước khi chơi)</button>' +
                '</div>';
            document.body.appendChild(welcome);
            function startGame() { welcome.style.display = 'none'; }
            $('wGo').onclick = () => { if (window.SCT_getPre && window.SCT_getPre() == null) { pendingStart = true; C.openTest(); toast('Hãy làm Kiểm tra đầu vào trước.'); C.startTest('pre'); } else startGame(); };
            $('wPre').onclick = () => { pendingStart = true; C.openTest(); C.startTest('pre'); };
            window.SCT_afterPre = function () { C.hideModal('mPrepost'); if (pendingStart) { pendingStart = false; startGame(); } };
            window.SCT_afterPost = function () { };

            /* ---------------- MUSIC + SOUND ---------------- */
            const audio = document.createElement('audio'); audio.loop = true; audio.volume = .35;
            audio.innerHTML = '<source src="bgm.mp3" type="audio/mpeg"><source src="nhac.mp3" type="audio/mpeg"><source src="music.mp3" type="audio/mpeg"><source src="background.mp3" type="audio/mpeg"><source src="bgm.ogg" type="audio/ogg">';
            document.body.appendChild(audio);
            let musicOn = false, pad = null;
            window.SCT_soundOn = true;
            function webPad(on) {
                try {
                    if (on) { const ac = new (window.AudioContext || window.webkitAudioContext)(); pad = { ac }; const notes = [196, 247, 294]; pad.oscs = notes.map(f => { const o = ac.createOscillator(), gg = ac.createGain(); o.type = 'sine'; o.frequency.value = f; gg.gain.value = .012; o.connect(gg); gg.connect(ac.destination); o.start(); return { o, gg }; }); }
                    else if (pad) { pad.oscs.forEach(x => { try { x.o.stop(); } catch (e) { } }); try { pad.ac.close(); } catch (e) { } pad = null; }
                } catch (e) { }
            }
            function toggleMusic() { musicOn = !musicOn; $('iMusic').classList.toggle('off', !musicOn); if (musicOn) { audio.play().catch(() => webPad(true)); } else { audio.pause(); webPad(false); } }
            function toggleSound() { window.SCT_soundOn = !window.SCT_soundOn; $('iSound').textContent = window.SCT_soundOn ? '🔊' : '🔇'; $('iSound').classList.toggle('off', !window.SCT_soundOn); toast(window.SCT_soundOn ? '🔊 Bật âm thanh' : '🔇 Tắt âm thanh'); }
            $('iMusic').onclick = toggleMusic; $('iSound').onclick = toggleSound;
            let autoStarted = false;
            function autoMusic() { if (autoStarted) return; autoStarted = true; if (!musicOn) { musicOn = true; $('iMusic').classList.remove('off'); audio.play().catch(() => webPad(true)); } }
            ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, autoMusic, { once: true }));

            /* ---------------- WIRING modal buttons ---------------- */
            $('hClear').onclick = () => { $('hFrom').value = ''; $('hTo').value = ''; $('hSearch').value = ''; C.hSwitchTab($('hTabOver').classList.contains('on') ? 'over' : 'detail'); };
            ['hFrom', 'hTo', 'hSearch'].forEach(id => $(id).addEventListener('input', () => { C.hSwitchTab($('hTabOver').classList.contains('on') ? 'over' : 'detail'); }));
            $('hTabDetail').onclick = () => C.hSwitchTab('detail'); $('hTabOver').onclick = () => C.hSwitchTab('over');
            $('hCSV').onclick = () => C.exportCSV();
            $('hClearData').onclick = () => { if (!window.SCT_isTeacher || !window.SCT_isTeacher()) { toast('🔒 Chỉ Giáo viên mới xoá được dữ liệu.'); C.openTeacher(); return; } if (confirm('Xoá toàn bộ lịch sử tham gia?')) { localStorage.removeItem(C.HIST_KEY); C.hSwitchTab('detail'); toast('Đã xoá dữ liệu lịch sử.'); } };
            $('hPDFd').onclick = () => C.exportDetailPDF(); $('hQRd').onclick = () => C.showHistoryQR();
            $('hPDFo').onclick = () => C.exportOverviewPDF(); $('hQRo').onclick = () => C.showHistoryQR();
            $('lbTabRank').onclick = () => C.lbSwitch('rank'); $('lbTabBadge').onclick = () => C.lbSwitch('badge');
            ['lbClass', 'lbPeriod', 'lbSearch'].forEach(id => $(id).addEventListener('input', () => C.renderLB()));
            $('vmWS').onclick = () => { hideModal('mVersion'); C.exportWorksheet(); };
            $('vmMulti').onclick = () => { hideModal('mVersion'); C.exportMultiCode(4); };
            $('vmReport').onclick = () => { hideModal('mVersion'); C.exportGameReport(); };
            $('vmCert').onclick = () => { hideModal('mVersion'); C.openCert(); };
            $('vmTeacher').onclick = () => { hideModal('mVersion'); C.openTeacher(); };

            /* ---------------- HOOKS đọc trạng thái game ---------------- */
            window.SCT_confetti = function () { try { if (typeof confetti === 'function') confetti(); } catch (e) { } };
            window.SCT_progressState = function () {
                let total = 5, cleared = 0, stars = 0, scoreV = 0, qc = 0;
                try { total = (typeof LEVELS !== 'undefined') ? LEVELS.length : 5; } catch (e) { }
                try { cleared = (typeof SCT_done !== 'undefined') ? SCT_done.size : 0; } catch (e) { }
                try { stars = (typeof starsTotal !== 'undefined') ? starsTotal : 0; } catch (e) { }
                try { scoreV = (typeof score !== 'undefined') ? score : 0; } catch (e) { }
                try { qc = (typeof quizCorrect !== 'undefined') ? quizCorrect : 0; } catch (e) { }
                const time = window.SCT_elapsed ? window.SCT_elapsed() : 0;
                const pre = window.SCT_getPre && window.SCT_getPre(), post = window.SCT_getPost && window.SCT_getPost();
                const bestWs = window.SCT_bestWs ? window.SCT_bestWs() : 0;
                return {
                    total, cleared, stars, score: scoreV, quizCorrect: qc, time, bestWs,
                    progress: (pre && post) ? (post.correct - pre.correct) : 0, fastTime: cleared >= total ? time : 0,
                    noHint: false, sessions: (C.loadHistory ? C.loadHistory().length : 0), certified: !!window.SCT_certifiedFlag,
                    myName: window.SCT_lastName || ''
                };
            };
            // fails theo màn cho biểu đồ "nhiệm vụ sai nhiều nhất"
            const sessionFails = [0, 0, 0, 0, 0];
            window.SCT_bumpFail = function (i) { if (i >= 0 && i < sessionFails.length) sessionFails[i]++; };
            window.SCT_updateBadges = function () { if ($('mLB') && $('mLB').classList.contains('open') && $('lbTabBadge').classList.contains('on')) C.renderBadges(); };

            // khi cấp chứng nhận → ghi lịch sử + xếp hạng
            window.SCT_onCertified = function (name, cls, school, s) {
                window.SCT_certifiedFlag = true; window.SCT_lastName = name;
                const pre = window.SCT_getPre && window.SCT_getPre(), post = window.SCT_getPost && window.SCT_getPost();
                const rec = {
                    name, cls, school, score: s.score || 0, stars: s.stars || 0, maxStars: (s.total * 3) || 15, ws: s.bestWs || 0,
                    done: s.cleared || 0, total: s.total || 5, time: s.time || 0, fails: sessionFails.slice(),
                    pre: pre ? pre.correct : null, post: post ? post.correct : null, testN: 8
                };
                C.recordSession(rec);
                C.saveLBEntry({ name, cls, score: s.score || 0, stars: s.stars || 0, ws: s.bestWs || 0 });
                toast('Đã lưu vào Lịch sử & Xếp hạng.');
            };

            /* ---------------- __game expose (kiểm thử) ---------------- */
            window.__game = {
                setLevel: (i) => { try { setLevel(i); } catch (e) { } },
                openTest: C.openTest, startTest: C.startTest, openHistory: C.openHistory,
                exportCSV: C.exportCSV, exportDetailPDF: C.exportDetailPDF, exportOverviewPDF: C.exportOverviewPDF, showHistoryQR: C.showHistoryQR,
                openLeaderboard: C.openLeaderboard, renderBadges: C.renderBadges, openTeacher: C.openTeacher,
                openDuel: C.openDuel, startDuel: C.startDuel, speak: C.speak, texToSpeech: C.texToSpeech,
                exportWorksheet: C.exportWorksheet, exportMultiCode: C.exportMultiCode, exportGameReport: C.exportGameReport,
                openCert: C.openCert, certEligible: C.certEligible, openSolution: C.openSolution, exportSolutionPDF: C.exportSolutionPDF,
                openPlayWS: C.openPlayWS, generateWorksheet: C.generateWorksheet, dedup4: C.dedup4,
                buildWsExam: C.buildWsExam, buildWsKeyPage: C.buildWsKeyPage, buildWsAnswerSheet: C.buildWsAnswerSheet,
                progressState: window.SCT_progressState, recordSession: C.recordSession, saveLBEntry: C.saveLBEntry,
                showModal: C.showModal, hideModal: C.hideModal, setBestWsForTest: (v) => { window.__testBestWs = v; }
            };
        })();

    </script>

</body>
